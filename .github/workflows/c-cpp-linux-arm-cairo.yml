name: C/C++ CI Linux ARM Without Cairo Graphics - Tcl8

on:
  push:
    branches: [ "3.1-TclTk9" ]
  pull_request:
    branches: [ "3.1-TclTk9" ]

jobs:
  build:

    runs-on: ubuntu-26.04-arm

    steps:
    - uses: actions/checkout@v4
    - name: Install
      run: sudo apt update && sudo apt-get install -y tcl8.6-dev tk8.6-dev python3-tk
    - name: Compile
      env: 
        CFLAGS: "-O2 -Wno-error=incompatible-pointer-types"
      run: python ./compile.py -n -t -c -v
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: .
